name: build

on:
  push:
    branches: [main]
    tags: ['v*-alien.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/alien-creativo/crm-aliencreativo

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Strip enterprise code and set CE edition
        run: |
          rm -rf enterprise spec/enterprise
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            first="$IMAGE:$GITHUB_REF_NAME"
            tags="$first"
          else
            first="$IMAGE:main-${GITHUB_SHA::7}"
            tags="$first,$IMAGE:staging"
          fi
          echo "first=$first" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify CE image has no enterprise code
        run: docker run --rm --entrypoint sh "${{ steps.meta.outputs.first }}" -c 'test ! -d /app/enterprise'
