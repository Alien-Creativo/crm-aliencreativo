# Staging bajo demanda (Coolify, servicio Docker Compose). Sin secretos: los SERVICE_* los genera Coolify.
# Escalado por variables: APP_REPLICAS (chatwoot), WORKER_REPLICAS (sidekiq), TUNNEL_REPLICAS (cloudflared).
# STAGING_FRONTEND_URL = URL https temporal del Quick Tunnel.
x-chatwoot-env: &chatwoot-env
  SECRET_KEY_BASE: ${SERVICE_PASSWORD_CHATWOOT}
  FRONTEND_URL: ${STAGING_FRONTEND_URL:-http://localhost:3000}
  DEFAULT_LOCALE: ${CHATWOOT_DEFAULT_LOCALE:-es}
  FORCE_SSL: 'false'
  ENABLE_ACCOUNT_SIGNUP: 'false'
  REDIS_URL: redis://default@redis:6379
  REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
  REDIS_OPENSSL_VERIFY_MODE: none
  POSTGRES_DATABASE: chatwoot
  POSTGRES_HOST: postgres
  POSTGRES_USERNAME: ${SERVICE_USER_POSTGRES}
  POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
  RAILS_MAX_THREADS: '3'
  NODE_ENV: production
  RAILS_ENV: production
  INSTALLATION_ENV: docker
  ACTIVE_STORAGE_SERVICE: local
  SMTP_ADDRESS: ''

services:
  chatwoot:
    image: ghcr.io/alien-creativo/crm-aliencreativo:staging
    pull_policy: always
    depends_on: [postgres, redis]
    environment: *chatwoot-env
    entrypoint: docker/entrypoints/rails.sh
    command: sh -c "bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0"
    deploy:
      replicas: ${APP_REPLICAS:-0}
    volumes:
      - rails-data:/app/storage
    healthcheck:
      test: [CMD, wget, --spider, -q, 'http://127.0.0.1:3000']
      interval: 10s
      timeout: 20s
      retries: 30
  sidekiq:
    image: ghcr.io/alien-creativo/crm-aliencreativo:staging
    pull_policy: always
    depends_on: [postgres, redis]
    environment: *chatwoot-env
    command: [bundle, exec, sidekiq, -C, config/sidekiq.yml]
    deploy:
      replicas: ${WORKER_REPLICAS:-0}
    volumes:
      - rails-data:/app/storage
  postgres:
    image: pgvector/pgvector:pg12
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER} -d chatwoot -h 127.0.0.1']
      interval: 15s
      timeout: 10s
      retries: 5
  redis:
    image: redis:alpine
    restart: always
    command: sh -c 'redis-server --requirepass "$${REDIS_PASSWORD}" --tcp-keepalive 60 --timeout 0'
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$${REDIS_PASSWORD}" PING | grep -q PONG']
      interval: 15s
      timeout: 10s
      retries: 5
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://chatwoot:3000
    deploy:
      replicas: ${TUNNEL_REPLICAS:-0}

volumes:
  rails-data:
  postgres-data:
  redis-data:
